{% extends 'base.html' %}

{% block title %}Account Settings | VeriFact AI{% endblock %}

{% block content %}
<div class="container d-flex align-items-center justify-content-center" style="min-height: 85vh; margin-top: 20px;">
    <div class="card shadow-lg border-0" style="max-width: 650px; width: 100%; border-radius: 24px; background: #ffffff;">
        <div class="card-header bg-transparent border-0 pt-5 text-center">
            <div class="mb-3">
                <div class="d-inline-block p-3 rounded-circle bg-light">
                    <i class="fas fa-user-cog fa-2x text-primary"></i>
                </div>
            </div>
            <h2 class="font-weight-bold" style="color: #0f172a;">Update Profile</h2>
            <p class="text-muted">Manage your personal information and security</p>
        </div>
        
        <div class="card-body px-5 pb-5">
            <form action="/update_profile" method="POST" enctype="multipart/form-data">
                <div class="row">
                    <div class="col-md-6">
                        <div class="form-group mb-4">
                            <label for="first_name" class="small font-weight-bold text-muted uppercase">First Name</label>
                            <input type="text" id="first_name" name="first_name" class="form-control modern-input" placeholder="John" required>
                        </div>
                    </div>
                    <div class="col-md-6">
                        <div class="form-group mb-4">
                            <label for="last_name" class="small font-weight-bold text-muted uppercase">Last Name</label>
                            <input type="text" id="last_name" name="last_name" class="form-control modern-input" placeholder="Doe" required>
                        </div>
                    </div>
                </div>

                <div class="form-group mb-4">
                    <label for="email" class="small font-weight-bold text-muted uppercase">Email Address</label>
                    <div class="input-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text bg-transparent border-right-0"><i class="fas fa-envelope text-muted"></i></span>
                        </div>
                        <input type="email" id="email" name="email" class="form-control modern-input border-left-0" placeholder="john@example.com" required>
                    </div>
                </div>

                <div class="form-group mb-4">
                    <label for="password" class="small font-weight-bold text-muted uppercase">Verify Password</label>
                    <div class="input-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text bg-transparent border-right-0"><i class="fas fa-lock text-muted"></i></span>
                        </div>
                        <input type="password" id="password" name="password" class="form-control modern-input border-left-0" placeholder="••••••••" required>
                    </div>
                    <small class="text-muted">Enter your current password to confirm changes.</small>
                </div>

                <div class="form-group mb-5">
                    <label for="profile_picture" class="small font-weight-bold text-muted uppercase">Profile Picture</label>
                    <div class="custom-file">
                        <input type="file" class="custom-file-input" id="profile_picture" name="profile_picture" required>
                        <label class="custom-file-label modern-input" for="profile_picture" style="overflow: hidden;">Choose image...</label>
                    </div>
                </div>

                <div class="d-flex flex-column gap-3">
                    <button type="submit" class="btn btn-primary btn-block mb-3 shadow-sm" style="border-radius: 12px; padding: 12px; font-weight: 600;">
                        Save Changes
                    </button>
                    <a href="{{ url_for('view_profile') }}" class="btn btn-light btn-block border" style="border-radius: 12px; padding: 10px; font-weight: 500; color: #64748b;">
                        Cancel and Go Back
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

<style>
    .modern-input {
        background-color: #f8fafc !important;
        border: 1px solid #e2e8f0 !important;
        border-radius: 10px !important;
        padding: 12px 15px !important;
        transition: all 0.3s ease;
    }
    
    .modern-input:focus {
        background-color: #fff !important;
        border-color: #6366f1 !important;
        box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1) !important;
    }

    .uppercase {
        letter-spacing: 0.05em;
        font-size: 0.75rem;
        display: block;
    }

    .custom-file-label::after {
        background-color: #6366f1;
        color: white;
        border-radius: 0 10px 10px 0;
        padding-top: 12px;
        height: calc(100% + 2px);
    }
</style>

<script>
    // Show filename in the custom file input
    $('.custom-file-input').on('change', function() {
        let fileName = $(this).val().split('\\').pop();
        $(this).next('.custom-file-label').addClass("selected").html(fileName);
    });
</script>
{% endblock %}
