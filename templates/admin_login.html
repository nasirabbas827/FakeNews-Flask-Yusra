{% extends 'base.html' %}

{% block title %}Admin Portal | VeriFact AI{% endblock %}

{% block content %}
<div class="container d-flex align-items-center justify-content-center" style="min-height: 80vh;">
    <div class="card shadow-lg border-0" style="max-width: 500px; width: 100%; border-radius: 20px; background: #ffffff;">
        
        <div class="text-center p-5" style="background: #0f172a; border-radius: 20px 20px 0 0;">
            <div class="mb-3">
                <span class="p-3 rounded-circle d-inline-block" style="background: rgba(99, 102, 241, 0.2); border: 1px solid #6366f1;">
                    <i class="fas fa-user-shield fa-2x text-primary"></i>
                </span>
            </div>
            <h2 class="font-weight-bold text-white mb-0">Admin Access</h2>
            <p class="small text-muted mb-0 mt-2">VeriFact AI System Management</p>
        </div>

        <div class="card-body p-5">
            {% if error %}
            <div class="alert alert-danger border-0 small shadow-sm mb-4" role="alert" style="border-radius: 10px; background-color: #fef2f2; color: #991b1b;">
                <i class="fas fa-exclamation-circle mr-2"></i> {{ error }}
            </div>
            {% endif %}

            <form method="POST" action="/adminlogin">
                <div class="form-group mb-4">
                    <label for="username" class="small font-weight-bold text-muted text-uppercase" style="letter-spacing: 1px;">Admin ID</label>
                    <div class="input-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text bg-light border-0" style="border-radius: 10px 0 0 10px;">
                                <i class="fas fa-terminal text-muted"></i>
                            </span>
                        </div>
                        <input type="text" class="form-control bg-light border-0" id="username" name="username" 
                               placeholder="Enter root ID" required style="border-radius: 0 10px 10px 0; height: 50px;">
                    </div>
                </div>

                <div class="form-group mb-4">
                    <label for="password" class="small font-weight-bold text-muted text-uppercase" style="letter-spacing: 1px;">Security Token</label>
                    <div class="input-group">
                        <div class="input-group-prepend">
                            <span class="input-group-text bg-light border-0" style="border-radius: 10px 0 0 10px;">
                                <i class="fas fa-key text-muted"></i>
                            </span>
                        </div>
                        <input type="password" class="form-control bg-light border-0" id="password" name="password" 
                               placeholder="••••••••" required style="border-radius: 0 10px 10px 0; height: 50px;">
                    </div>
                </div>

                <button type="submit" class="btn btn-dark btn-block shadow" 
                        style="border-radius: 12px; height: 50px; font-weight: 700; background: #0f172a; border: none; transition: all 0.3s;">
                    Authenticate Session
                </button>
            </form>
            
            <div class="text-center mt-4">
                <a href="/" class="small text-muted"><i class="fas fa-arrow-left mr-1"></i> Return to Main Site</a>
            </div>
        </div>
    </div>
</div>

<style>
    /* Admin-specific focus effect */
    .form-control:focus {
        background-color: #fff !important;
        box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.1) !important;
        border: 1px solid #0f172a !important;
    }
    .btn-dark:hover {
        background: #1e293b !important;
        transform: translateY(-2px);
    }
</style>
{% endblock %}
